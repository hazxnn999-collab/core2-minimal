name: Compilar APK con Gradle 4.6 y JDK 8

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Aceptar licencias de Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Compilar APK Debug
        working-directory: ./CORE2_MINIMAL
        run: gradle assembleDebug

      - name: Subir APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: CORE2_MINIMAL-apk
          path: CORE2_MINIMAL/app/build/outputs/apk/debug/*.apk

